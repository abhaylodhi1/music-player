<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Music Player</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css">
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

  <video id="background-video" autoplay loop muted>
    <source id="video-source" src="videos/default.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <div class="player">
   
    <video id="track-video" class="track-video" autoplay muted loop>
      <source src="musics/lahore.mp4" type="video/mp4"> 
      Your browser does not support the video tag.
    </video>

    <div class="details">
      <div id="now-playing" class="now-playing">PLAYING x OF y</div>
      <div class="track-art"></div>
      <div id="track-name" class="track-name">Track Name</div>
      <div id="track-artist" class="track-artist">Track Artist</div>
    </div>
    <div class="buttons">
      <div class="prev-track" onclick="prevTrack()"><i class="fa fa-step-backward fa-2x"></i></div>
      <div class="playpause-track" id="playpause-btn" onclick="playpauseTrack()"><i class="fa fa-play-circle fa-5x"></i></div>
      <div class="next-track" onclick="nextTrack()"><i class="fa fa-step-forward fa-2x"></i></div>
    </div>
    <div class="slider_container">
      <div class="current-time" id="current-time">00:00</div>
      <input type="range" min="1" max="100" value="0" class="seek_slider" id="seek-slider" onchange="seekTo()">
      <div class="total-duration" id="total-duration">00:00</div>
    </div>
    <div class="slider_container">
      <i class="fa fa-volume-down"></i>
      <input type="range" min="1" max="100" value="99" class="volume_slider" id="volume-slider" onchange="setVolume()">
      <i class="fa fa-volume-up"></i>
    </div>
  </div>


  <script src="music.js"></script>
</body>
</html>
